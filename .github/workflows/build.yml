name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/viplayer.p12"
            ALIAS=$(keytool -list -v -keystore "$RUNNER_TEMP/viplayer.p12" -storetype pkcs12 \
              -storepass "$KEYSTORE_PASSWORD" | grep -m1 'Alias name:' | sed 's/^Alias name: //')
            {
              echo "VIPLAYER_KEYSTORE=$RUNNER_TEMP/viplayer.p12"
              echo "VIPLAYER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "VIPLAYER_KEY_ALIAS=$ALIAS"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 is not set, APK will be signed with a temporary debug key"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ViPlayer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ViPlayer-apk
          path: ViPlayer.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ViPlayer 1.0.${{ github.run_number }}
          files: ViPlayer.apk
          make_latest: true
